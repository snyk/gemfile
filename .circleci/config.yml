version: 2.1

orbs:
  prodsec: snyk/prodsec-orb@1

defaults: &defaults
  resource_class: small
  docker:
    - image: cimg/node:24.16

jobs:
  security-scans:
    <<: *defaults
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto
          open-source-additional-arguments: --exclude=test
          iac-scan: disabled
          release-branch: master

  tests:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Install dev dependencies
          command: npm install
      - run:
          name: Run tests
          command: npm run test

  release:
    <<: *defaults
    steps:
      - checkout
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25.0.3

workflows:
  version: 2
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-sca-scanners
          filters:
            branches:
              ignore:
                - master

      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - prodsec-orb-runtime

      - tests:
          name: Tests

      - release:
          name: Release
          context:
            - nodejs-install
            - github-release
          requires:
            - Tests
          filters:
            branches:
              only:
                - master
